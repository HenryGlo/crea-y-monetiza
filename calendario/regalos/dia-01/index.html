/* Layout: un carril de 560px; barra de progreso fija arriba, acciones fijas abajo al alcance del pulgar; cada bloque es una carta crema con borde ondulado sobre el papel del regalo. Tema claro deliberado. */
:root{
  --night:#4A0E13; --wine:#61121E; --plum:#73063C; --crimson:#A00F2D; --hot:#DF4D8C; --blush:#E07A9F; --petal:#EBA3C9;
  --cream:#FFFCF6; --paper:#D27F9A; --ink:#3A0A16; --muted:#86545F; --line:#EFD8E0; --soft:#FCE8F0; --soft2:#F8D3E1;
  --fd:"Gulfs Display","Agrandir Grand","Arial Black",sans-serif;
  --fb:"Agrandir","Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;background-color:var(--paper);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--cream)}
p{margin:0}
h1,h2{font-family:var(--fd);color:var(--night);margin:0;line-height:1.02;text-transform:uppercase;text-wrap:balance;font-weight:900}
h1{font-size:clamp(34px,9.5vw,46px)}
h2{font-size:clamp(22px,6.2vw,28px)}
h3{font-family:var(--fb);font-weight:800;font-size:19px;line-height:1.25;color:var(--night);margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hot)}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .in{max-width:560px;margin:0 auto;background:var(--cream);border:2.5px solid var(--night);border-radius:999px;display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;box-shadow:0 6px 16px -10px rgba(58,10,22,.6)}
.back{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--night);font-size:20px;font-weight:800;cursor:pointer;display:grid;place-items:center}
.back:disabled{opacity:.35;cursor:default}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.prog .lab{font-size:12.5px;font-weight:800;color:var(--night);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:999px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--hot),var(--crimson));transition:width .4s ease}
.stepn{font-size:12.5px;font-weight:800;color:var(--hot);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Contenido */
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(150px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .35s ease both}

.carta.wine h1,.carta.wine h2,.carta.wine h3{color:var(--cream)}
.carta.pink h2,.carta.pink h3{color:#fff}
.carta.wine .eyebrow{color:var(--petal)}
.carta.pink .eyebrow{color:#FFE3EE}

/* Inicio */
.gift{float:right;width:78px;margin:-6px -4px 6px 10px;transform:rotate(7deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.hero-sub{display:block;font-family:var(--fb);font-weight:500;font-size:clamp(20px,5.6vw,26px);text-transform:uppercase;color:var(--petal);line-height:1.05;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 11px;background:var(--soft);color:var(--night)}
.carta.wine .chip{background:rgba(255,255,255,.12);color:#FBE3EC}
.ig{display:flex;flex-wrap:wrap;gap:8px}
.ig a{display:inline-flex;align-items:center;gap:6px;background:var(--cream);color:var(--night);border:2px solid var(--night);border-radius:999px;padding:7px 13px;font-weight:800;font-size:13.5px;text-decoration:none}
.carta.wine .ig a{border-color:var(--petal)}
.map{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:m}
.map li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;counter-increment:m}
.map li::before{content:counter(m);width:36px;height:36px;border-radius:50%;background:var(--night);color:var(--cream);font-weight:800;display:grid;place-items:center;font-size:15px}
.map b{display:block;color:var(--night)}
.map span{font-size:14.5px;color:var(--muted)}

/* Opciones grandes */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;width:100%;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px;min-height:60px;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:16px;font-weight:700;transition:transform .12s,background .15s,border-color .15s}
.opt .e{font-size:26px;line-height:1;flex:none}
.opt .t{flex:1}
.opt .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{border-color:var(--hot);background:var(--soft)}
.opt[aria-pressed="true"] .ck{background:var(--hot);border-color:var(--hot);color:#fff}
.qdots{display:flex;gap:6px}
.qdots i{flex:1;height:5px;border-radius:999px;background:var(--soft2)}
.qdots i.on{background:var(--hot)}

/* Modelos */
.mstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mchip{font:inherit;height:46px;border-radius:14px;border:2px solid var(--night);background:var(--cream);font-size:20px;cursor:pointer;display:grid;place-items:center;padding:0;position:relative}
.mchip.on{background:var(--soft);border-width:3px;border-color:var(--crimson);box-shadow:0 0 0 3px var(--cream);transform:translateY(-2px)}
.mchip .st{position:absolute;right:-5px;top:-7px;font-size:13px}
.mhead{display:flex;gap:12px;align-items:center}
.memo{width:58px;height:58px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:30px;flex:none}
.lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hot);margin-bottom:2px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.pc{grid-template-columns:1fr}}
.pc>div{background:var(--soft);border-radius:16px;padding:12px}
.pc>div.con{background:#F7EEE9}
.pc ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.pc li{display:grid;grid-template-columns:18px 1fr;gap:4px}
.pc .pro li::before{content:"✓";color:var(--crimson);font-weight:800}
.pc .con li::before{content:"•";color:var(--muted);font-weight:800}
.note{font-size:13.5px;color:var(--muted);background:var(--cream);border:2px solid var(--night);border-radius:16px;padding:10px 14px}

/* Filtros */
.frow{display:flex;flex-direction:column;gap:8px}
.tg{font:inherit;width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--ink);font-weight:700;font-size:15px}
.tg .e{font-size:20px;flex:none}
.tg .t{flex:1}
.sw{flex:none;width:46px;height:28px;border-radius:999px;background:var(--soft2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tg[aria-pressed="true"]{border-color:var(--hot);background:var(--soft)}
.tg[aria-pressed="true"] .sw{background:var(--crimson)}
.tg[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.fhead{display:flex;align-items:center;gap:10px}
.fhead .e{font-size:26px}
.fhead .n{margin-left:auto;font-size:13px;font-weight:800;color:var(--hot);font-variant-numeric:tabular-nums}

/* Resultado */
.big-e{font-size:54px;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both .1s}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.why li{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-size:14.5px;font-weight:600}
.rank{display:flex;flex-direction:column;gap:8px}

  return "";
}

function lbShow(cap){const lb=document.getElementById("lb");document.getElementById("lbCap").textContent=cap||"";lb.hidden=false;lb.querySelector(".lbx").focus()}
function lbOpen(src,alt,video){
  const im=document.getElementById("lbImg"),vb=document.getElementById("lbVid"),cd=document.getElementById("lbCard");
  cd.hidden=true;im.hidden=!!video;vb.hidden=!video;
  if(video){vb.poster=src;vb.src=video;try{const p=vb.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}else{im.src=src;im.alt=alt}
  lbShow(alt);
}
function lbStory(id,m){const c=CASOS.find(x=>x.id===id);if(!c)return;const cd=document.getElementById("lbCard");document.getElementById("lbImg").hidden=true;document.getElementById("lbVid").hidden=true;cd.innerHTML=storyHTML({c,m},true);cd.hidden=false;lbShow("")}
function lbClose(){const lb=document.getElementById("lb");if(lb.hidden)return;lb.hidden=true;const vb=document.getElementById("lbVid");try{vb.pause()}catch(e){}vb.removeAttribute("src");vb.load();document.getElementById("lbImg").removeAttribute("src");document.getElementById("lbCard").innerHTML=""}
document.addEventListener("click",e=>{
  const b=e.target.closest(".hs-shot,.hs-play,.shot,.mini");if(b){lbOpen(b.dataset.img,b.dataset.alt,b.dataset.video);return}
  const d=e.target.closest(".hs-dots button");if(d){const t=d.closest(".hs").querySelector(".hs-track"),k=t.children[+d.dataset.i];if(k)t.scrollTo({left:k.offsetLeft-t.offsetLeft,behavior:"smooth"});return}
  if(e.target.closest("#lbVid,#lbCard"))return;if(e.target.closest("#lb"))lbClose();
});

/* ===== Estado ===== */
const KEY="elige-tu-camino-v2";
const blank=()=>({s:0,qi:0,mi:0,ans:{},re:{},fl:{},pick:[],quien:"",logro:"",con:"",tests:[false,false,false],dia:"",hora:"",tener:""});
let S=blank();try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x.s==="number")S=Object.assign(blank(),x)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const h=(html)=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild};
let timer=null;
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,1900)}
function copy(txt,ok){const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(ok)}catch(e){toast("No se pudo copiar, selecciona el texto")}ta.remove()};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(ok),fb);else fb()}catch(e){fb()}}

/* ===== Puntaje ===== */
function pool(){const p=M.filter(m=>S.re[m.id]!=="no");return p.length?p:M.slice()}
const MAX={};M.forEach(m=>{let mx=3+6;Q.forEach(q=>{mx+=Math.max(0,...q.o.map(o=>o[2][m.id]||0))});MAX[m.id]=mx});
function scores(){
  const sc={},why={};M.forEach(m=>{sc[m.id]=0;why[m.id]=[]});
  Q.forEach(q=>{const i=S.ans[q.k];if(i==null)return;const o=q.o[i];Object.entries(o[2]).forEach(([id,p])=>{sc[id]+=p;if(o[3]&&!why[id].includes(o[3]))why[id].push(o[3])})});
  M.forEach(m=>{const r=S.re[m.id];if(r==="si"){sc[m.id]+=3;why[m.id].unshift("te llamó la atención desde el principio")}else if(r==="tal")sc[m.id]+=1;
    (S.fl[m.id]||[]).forEach((v,i)=>{if(v){sc[m.id]+=2;why[m.id].push(F[i][2])}})});
  const ranked=pool().sort((a,b)=>sc[b.id]-sc[a.id]||((S.fl[b.id]||[])[0]?1:0)-((S.fl[a.id]||[])[0]?1:0));
  const pct=id=>Math.round(Math.min(1,sc[id]/MAX[id])*100);
  return{sc,why,ranked,pct};
}

/* ===== Navegación ===== */
function go(n){clearTimeout(timer);S.s=Math.max(0,Math.min(STEPS.length-1,n));save();render();window.scrollTo({top:0,behavior:"smooth"})}
function back(){clearTimeout(timer);const s=STEPS[S.s][0];
  if(s==="sobre"&&S.qi>0){S.qi--;save();render();return}
  if(s==="modelos"&&S.mi>0){S.mi--;save();render();return}
  if(s==="modelos"){S.qi=Q.length-1}
  if(s==="filtros"){S.mi=5}
  go(S.s-1)}
$("back").onclick=back;
function dock(nodes){const d=$("dockIn");d.innerHTML="";nodes.filter(Boolean).forEach(n=>d.appendChild(n));requestAnimationFrame(()=>{document.querySelector(".app").style.paddingBottom=($("dock").offsetHeight+24)+"px"})}
window.addEventListener("resize",()=>{document.querySelector(".app").style.paddingBottom=($("dock").offsetHeight+24)+"px"});
function btn(txt,fn,cls,dis){const b=h(`<button type="button" class="btn ${cls||""}">${txt}</button>`);b.onclick=fn;if(dis)b.disabled=true;return b}
function render(){
  const [id,name]=STEPS[S.s];
  $("topbar").hidden=S.s===0;
  let frac=S.s/(STEPS.length-1);
  if(id==="sobre")frac=(1+S.qi/Q.length)/(STEPS.length-1);
  if(id==="modelos")frac=(2+S.mi/6)/(STEPS.length-1);
  $("barI").style.width=(frac*100)+"%";
  $("lab").textContent=id==="sobre"?name+" · "+(S.qi+1)+"/"+Q.length:id==="modelos"?name+" · "+(S.mi+1)+"/6":name;
  $("stepn").textContent=S.s+"/"+(STEPS.length-1);
  const el=$("screen");el.innerHTML="";const sc=h('<div class="screen"></div>');el.appendChild(sc);
  ({inicio,sobre,modelos,filtros,resultado,frase,paso,final})[id](sc);
}

function sobre(c){
  const q=Q[S.qi];
  const card=h(`<section class="carta"><div class="qdots">${Q.map((_,i)=>`<i class="${i<=S.qi?"on":""}"></i>`).join("")}</div>
    <span class="eyebrow">💭 Pregunta ${S.qi+1} de ${Q.length}</span><h2>${esc(q.t)}</h2><div class="opts" role="group"></div></section>`);
  const os=card.querySelector(".opts");
  q.o.forEach((o,i)=>{const b=h(`<button type="button" class="opt" aria-pressed="${S.ans[q.k]===i}"><span class="e">${o[0]}</span><span class="t">${esc(o[1])}</span><span class="ck">✓</span></button>`);
    b.onclick=()=>{S.ans[q.k]=i;save();os.querySelectorAll(".opt").forEach((x,j)=>x.setAttribute("aria-pressed",j===i));nx.classList.remove("soft");
      clearTimeout(timer);timer=setTimeout(next,380)};os.appendChild(b)});
  c.append(card);
  if(S.qi===0)c.append(h(`<p class="note">No hay respuestas buenas o malas. Elige la que más se parezca a ti hoy.</p>`));
  const next=()=>{if(S.qi<Q.length-1){S.qi++;save();render();window.scrollTo({top:0,behavior:"smooth"})}else{S.mi=0;go(2)}};
  const nx=btn(S.qi<Q.length-1?"Siguiente ›":"Ver los 6 modelos 💎",()=>{clearTimeout(timer);if(S.ans[q.k]==null){toast("Elige una opción para seguir 💭");return}next()},S.ans[q.k]==null?"soft":"");
  dock([nx]);
}
function modelos(c){
  const m=M[S.mi];
  const strip=h('<div class="mstrip" role="tablist" aria-label="Los 6 modelos"></div>');
  M.forEach((x,i)=>{const r=S.re[x.id];const b=h(`<button type="button" class="mchip${i===S.mi?" on":""}" aria-label="Modelo ${i+1}: ${esc(x.n)}">${x.e}${r?`<span class="st">${r==="si"?"💖":r==="tal"?"🤔":"🙅‍♀️"}</span>`:""}</button>`);b.onclick=()=>{clearTimeout(timer);S.mi=i;save();render()};strip.appendChild(b)});
  c.append(strip);
  c.append(h(`<section class="carta"><div class="mhead"><span class="memo">${m.e}</span><div><span class="eyebrow">Modelo ${S.mi+1} de 6</span><h2>${esc(m.n)}</h2></div></div>
    <div class="chips"><span class="chip">👥 ${esc(m.aud)}</span><span class="chip">💸 ${esc(m.ing)}</span><span class="chip">⏳ ${esc(m.t)}</span></div>
    <div><span class="lbl">Qué es</span><p>${esc(m.que)}</p></div>
    <div><span class="lbl">Encaja contigo si…</span><p>${esc(m.fit)}</p></div>
    <div class="pc"><div class="pro"><span class="lbl">💗 Lo bueno</span><ul>${m.pros.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="con"><span class="lbl">⚠️ A tener en cuenta</span><ul>${m.cons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></section>`));
  if(S.mi===0)c.append(h(`<p class="note">Los tiempos son orientativos, no promesas. Dependen de tu punto de partida y del momento de las marcas.</p>`));
  const hint=h(`<span class="hint">${S.re[m.id]?"Ya lo marcaste. Puedes cambiarlo 👇":"¿Qué sientes con este modelo? 👇"}</span>`);
  const rc=h('<div class="react" role="group" aria-label="¿Qué sientes con este modelo?"></div>');
  REACT.forEach(([e,l,v])=>{const b=h(`<button type="button" class="rbtn" aria-pressed="${S.re[m.id]===v}"><span class="e">${e}</span>${l}</button>`);
    b.onclick=()=>{S.re[m.id]=v;save();rc.querySelectorAll(".rbtn").forEach(x=>x.setAttribute("aria-pressed",x===b));
      const miss=M.findIndex(x=>!S.re[x.id]);
      hint.className="hint ok";hint.textContent=S.mi<5?"¡Anotado! Vamos al modelo "+(S.mi+2)+" ✨":miss>-1?"¡Anotado! Te falta el modelo "+(miss+1):"¡Listo! Vamos a los filtros ✅";
      clearTimeout(timer);timer=setTimeout(()=>{if(S.mi<5){S.mi++;save();render();window.scrollTo({top:0,behavior:"smooth"})}else if(miss>-1){S.mi=miss;save();render();window.scrollTo({top:0,behavior:"smooth"})}else go(3)},750)};
    rc.appendChild(b)});
  let nx2=null;
  if(S.re[m.id]){const all=M.every(x=>S.re[x.id]);if(all)hint.textContent="Ya marcaste los 6 ✅ Puedes cambiarlo 👇";
    nx2=btn(all?"Ir a los filtros ✅":S.mi<5?"Siguiente modelo ›":"Ir al modelo que falta ›",()=>{clearTimeout(timer);const miss=M.findIndex(x=>!S.re[x.id]);
      if(all)go(3);else{S.mi=S.mi<5?S.mi+1:miss;save();render();window.scrollTo({top:0,behavior:"smooth"})}},"slim")}
  dock([hint,rc,nx2]);
}
function filtros(c){
  c.append(h(`<section class="carta"><span class="eyebrow">✅ Los 3 filtros</span><h2>Elige 1 o 2</h2><p class="muted">Activa cada filtro donde tu respuesta sea <b>sí</b>. Solo aparecen los modelos que no descartaste.</p></section>`));
  pool().forEach(m=>{const f=S.fl[m.id]||(S.fl[m.id]=[false,false,false]);
    const card=h(`<section class="carta"><div class="fhead"><span class="e">${m.e}</span><h3>${esc(m.n)}</h3><span class="n">${f.filter(Boolean).length}/3</span></div><div class="frow"></div></section>`);
    const fr=card.querySelector(".frow");
    F.forEach(([e,t],i)=>{const b=h(`<button type="button" class="tg" aria-pressed="${!!f[i]}"><span class="e">${e}</span><span class="t">${esc(t)}</span><span class="sw" aria-hidden="true"></span></button>`);
      b.onclick=()=>{f[i]=!f[i];save();b.setAttribute("aria-pressed",f[i]);card.querySelector(".n").textContent=f.filter(Boolean).length+"/3"};fr.appendChild(b)});
    c.append(card)});
  c.append(h(`<p class="note">💡 Si hay empate, gana el que puedas empezar hoy.</p>`));
  dock([btn("Ver mi camino ✨",()=>{S.pick=[scores().ranked[0].id];save();go(4)})]);
}
function resultado(c){
  const {why,ranked,pct}=scores();const top=ranked[0];
  if(!S.pick.length||!S.pick.every(id=>ranked.some(m=>m.id===id))){S.pick=[top.id];save()}
  const w=why[top.id].slice(0,4);
  c.append(h(`<section class="carta pink"><span class="eyebrow">✨ Tu mejor camino para empezar</span><div class="big-e">${top.e}</div><h2>${esc(top.n)}</h2>
    <p style="font-weight:700">${pct(top.id)}% de afinidad contigo</p>
    ${w.length?`<ul class="why">${w.map(x=>`<li>💗 Porque ${esc(x)}</li>`).join("")}</ul>`:""}</section>`));
  const card=h(`<section class="carta"><h3>Tu ranking</h3><p class="muted" style="font-size:14.5px">Puedes quedarte con 1 o 2 modelos. Toca para elegir.</p><div class="rank"></div></section>`);
  const rk=card.querySelector(".rank");
  ranked.forEach(m=>{const p=pct(m.id);const b=h(`<button type="button" class="ritem" aria-pressed="${S.pick.includes(m.id)}"><span class="e">${m.e}</span><div><b>${esc(m.n)}</b><div class="meter"><span><i style="width:${p}%"></i></span><em>${p}%</em></div></div><span class="ck">✓</span></button>`);
    b.onclick=()=>{const k=S.pick.indexOf(m.id);if(k>-1){if(S.pick.length>1)S.pick.splice(k,1);else{toast("Elige al menos 1 modelo 💗");return}}else{if(S.pick.length>=2){toast("Máximo 2 modelos 💗");return}S.pick.push(m.id)}save();render()};rk.appendChild(b)});
  c.append(card);
  dock([btn("Escribir mi frase ✍️",()=>go(5))]);
}
function frase(c){
  const m=MI[S.pick[0]];
  const pv=h('<div class="preview" aria-live="polite"></div>');
  const card=h(`<section class="carta"><span class="eyebrow">✍️ Tu frase</span><h2>Qué haces y para quién</h2><p class="muted">Una línea que se entienda en 5 segundos. Escríbela o toca una idea para empezar.</p></section>`);
  card.append(pv);
  const nx=btn("Agendar mi primer paso 📅",()=>{const ms=[["quien","a quién ayudas"],["logro","qué logran contigo"],["con","con qué lo haces"]].find(([k])=>!S[k]);if(ms){toast("Te falta: "+ms[1]+" ✍️");const i=$("f-"+ms[0]);if(i){i.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>{try{i.focus({preventScroll:true})}catch(e){}},350)}return}go(6)});
  const upd=()=>{const ph=(v,p)=>v?esc(v):`<span class="ph">${p}</span>`;pv.innerHTML=`Ayudo a ${ph(S.quien,"[quién]")} a ${ph(S.logro,"[lograr qué]")} con ${ph(S.con,"[lo que haces]")}.`;nx.classList.toggle("soft",!(S.quien&&S.logro&&S.con))};
  [["quien","¿A quién ayudas? 👯‍♀️",m.sq],["logro","¿Qué logran contigo? 🌟",m.sl],["con","¿Con qué lo haces? 🎀",m.sc]].forEach(([k,l,sg])=>{
    const f=h(`<div class="field"><label for="f-${k}">${l}</label><input id="f-${k}" autocomplete="off" value="${esc(S[k])}" placeholder="${esc(sg[0])}"><div class="sugs"></div></div>`);
    const inp=f.querySelector("input");inp.oninput=()=>{S[k]=inp.value.trim();save();upd()};
    sg.forEach(x=>{const b=h(`<button type="button" class="sug">+ ${esc(x)}</button>`);b.onclick=()=>{inp.value=x;S[k]=x;save();upd()};f.querySelector(".sugs").appendChild(b)});
    card.append(f)});
  c.append(card);
  const t=h(`<section class="carta"><h3>3 pruebas rápidas 🔍</h3><ul class="tests"></ul><p class="note">«Hago guiones y edito videos» dice tareas. «Ayudo a ___ a ___ con ___» dice a quién le sirve y qué cambia.</p></section>`);
  ["¿Se entiende en 5 segundos?","¿Dice un resultado y no una lista de tareas?","¿Alguien diría «eso es para mí»?"].forEach((x,i)=>{const li=h(`<li><label for="t${i}"><input type="checkbox" id="t${i}" ${S.tests[i]?"checked":""}><span>${x}</span></label></li>`);li.querySelector("input").onchange=e=>{S.tests[i]=e.target.checked;save()};t.querySelector(".tests").appendChild(li)});
  c.append(t);
  dock([nx]);upd();
}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function paso(c){
  const m=MI[S.pick[0]];if(!S.tener)S.tener=m.tener;
  const today=new Date(),tom=new Date(today);tom.setDate(today.getDate()+1);const sat=new Date(today);sat.setDate(today.getDate()+((6-today.getDay()+7)%7||7));
  const D=[["Hoy",iso(today)],["Mañana",iso(tom)],["El sábado",iso(sat)]].filter((x,i,a)=>a.findIndex(y=>y[1]===x[1])===i);const T=[["🌅 Mañana · 9:00","09:00"],["☀️ Tarde · 3:00","15:00"],["🌙 Noche · 8:00","20:00"]];
  const card=h(`<section class="carta"><span class="eyebrow">📅 Tu primer paso</span><h2>30 minutos, con fecha</h2>
    <div class="step30"><span class="e">⏱️</span><span>${esc(m.paso)}</span></div>
    <div class="field"><label>¿Qué día?</label><div class="qchips" id="dq"></div><input type="date" id="d1" value="${esc(S.dia)}" aria-label="Otra fecha"></div>
    <div class="field"><label>¿A qué hora?</label><div class="qchips" id="tq"></div><input type="time" id="h1" value="${esc(S.hora)}" aria-label="Otra hora"></div>
    <div class="field"><label for="tn">Lo que voy a tener al terminar 🎁</label><textarea id="tn">${esc(S.tener)}</textarea></div></section>`);
  const nx=btn("Ver mi camino completo 💖",()=>{if(!S.dia){toast("Elige el día de tu primer paso 📅");card.querySelector("#dq").scrollIntoView({behavior:"smooth",block:"center"});return}go(7)});
  const di=card.querySelector("#d1"),hi=card.querySelector("#h1");
  const sync=()=>{card.querySelectorAll("#dq .qchip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.dia));card.querySelectorAll("#tq .qchip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.hora));di.value=S.dia;hi.value=S.hora;nx.classList.toggle("soft",!S.dia)};
  D.forEach(([l,v])=>{const b=h(`<button type="button" class="qchip" data-v="${v}">${l}</button>`);b.onclick=()=>{S.dia=v;save();sync()};card.querySelector("#dq").appendChild(b)});
  T.forEach(([l,v])=>{const b=h(`<button type="button" class="qchip" data-v="${v}">${l}</button>`);b.onclick=()=>{S.hora=v;save();sync()};card.querySelector("#tq").appendChild(b)});
  di.onchange=()=>{S.dia=di.value;save();sync()};hi.onchange=()=>{S.hora=hi.value;save();sync()};card.querySelector("#tn").oninput=e=>{S.tener=e.target.value;save()};
  c.append(card);dock([nx]);sync();
}
function fecha(){if(!S.dia)return"";try{const d=new Date(S.dia+"T"+(S.hora||"12:00"));let s=d.toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});s=s.charAt(0).toUpperCase()+s.slice(1);if(S.hora)s+=" · "+d.toLocaleTimeString("es",{hour:"numeric",minute:"2-digit"});return s}catch(e){return S.dia}}
function resumen(){const ms=S.pick.map(id=>MI[id]);return `Mi camino ✨\n\nMi modelo: ${ms.map(m=>m.e+" "+m.n).join(" + ")}\nMi frase: Ayudo a ${S.quien} a ${S.logro} con ${S.con}.\nMi primer paso: ${MI[S.pick[0]].paso}\nCuándo: ${fecha()}\nLo que voy a tener: ${S.tener}\n\nElige tu camino · @pierinaalves · @creaymonetizacampus`}
function final(c){
  const ms=S.pick.map(id=>MI[id]);const msg="YA TENGO MI MODELO ✨ Me salió: "+ms.map(m=>m.n).join(" + ");
  c.append(h(`<section class="carta pink"><span class="eyebrow">🎉 ¡Lo lograste!</span><h2>Este es tu camino</h2><p>Guárdalo y cúmplete el primer paso. Tu yo de 2027 te lo va a agradecer. 💌</p></section>`));
  c.append(h(`<section class="carta letter">
    <div class="row"><span class="lbl">Mi modelo</span><span class="val">${ms.map(m=>m.e+" "+esc(m.n)).join("<br>")}</span></div>
    <div class="row"><span class="lbl">Mi frase</span><span class="frase">Ayudo a ${esc(S.quien)} a ${esc(S.logro)} con ${esc(S.con)}.</span></div>
    <div class="row"><span class="lbl">Mi primer paso</span><span class="val">${esc(MI[S.pick[0]].paso)}</span></div>
    <div class="row"><span class="lbl">Cuándo</span><span class="val">📅 ${esc(fecha())}</span></div>
    <div class="row"><span class="lbl">Lo que voy a tener</span><span class="val">${esc(S.tener)}</span></div>
    <span class="sign">— Con cariño, Campus Crea y Monetiza 💗</span></section>`));
  {const g=casosCard(S.pick);if(g)c.append(h(g))}
  const cta=h(`<section class="carta wine"><span class="eyebrow">💌 ¿Y ahora qué?</span><h2>¿Quieres un plan para tu camino?</h2>
    <p>Elegir es el primer paso. En el Campus te acompañamos a convertirlo en ingresos, con mentoría y un plan paso a paso para tu modelo.</p>
    <p>Mándanos este mensaje por DM y agendamos una llamada para ver tu caso:</p><p class="dm">«${esc(msg)}»</p></section>`);
  c.append(cta);
  const again=h('<button type="button" class="linkbtn">Hacerlo otra vez</button>');again.onclick=()=>{S=blank();save();go(0)};c.append(again);
  const dmb=h(`<a class="btn" href="${IG_DM}" target="_blank" rel="noopener">Copiar mensaje y escribirnos 💖</a>`);dmb.addEventListener("click",()=>copy(msg,"Mensaje copiado. Pégalo en el chat 💖"));
  dock([dmb,btn("Copiar mi camino 📋",()=>copy(resumen(),"Tu camino quedó copiado 💖"),"light")]);
}
render();
</script>
