button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:900;text-transform:uppercase;color:var(--vino);line-height:.95;margin:0}
p{margin:0}

/* ---------- Marco y hoja ---------- */
.wrap{min-height:100dvh;padding:6.5vw;display:flex;justify-content:center;align-items:stretch}
.sheet{position:relative;width:100%;max-width:1180px;background:#fff;border-radius:28px;box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column}
.spk{position:absolute;pointer-events:none;animation:tw 3.4s ease-in-out infinite}
.spk.a{top:16px;right:18px}.spk.b{top:46px;right:52px;animation-delay:1.1s}
.sheet>.spk{display:none}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* Móvil: cabecera */
.rail{padding:18px 18px 0}
.rail-d{display:none}
.m-head{display:flex;align-items:center;gap:12px}
.m-head img{width:46px;height:auto;flex:none}
.m-head .dia{font-family:var(--display);font-size:34px;line-height:.85;color:var(--rosa)}
.m-head .dia small{display:block;font:900 10px/1 var(--body);letter-spacing:.26em;color:var(--frambuesa);margin-bottom:3px}
.m-head .qn{margin-left:auto;font:900 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--frambuesa)}
.bar{display:flex;gap:4px;margin:14px 0 0}
.bar i{flex:1;height:6px;border-radius:6px;background:var(--rosa-l);transition:background .3s}
.bar i.on{background:var(--cereza)}

.stage{flex:1;display:flex;flex-direction:column;padding:22px 18px 18px}
.scr{flex:1;display:flex;flex-direction:column;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font:900 11px/1.2 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--frambuesa)}
.q-title{font-size:clamp(34px,9.4vw,46px);margin:10px 0 12px}
.q-help{color:var(--texto-2);font-size:16px;max-width:560px}
.q-body{margin-top:22px;max-width:640px}
.lead{display:block;font:900 12px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--frambuesa);margin:0 0 8px 4px}
.field{width:100%;font:400 18px/1.4 var(--body);color:var(--vino);background:#fff;border:2px solid var(--rosa-l);border-radius:18px;padding:15px 18px;outline:0;transition:border-color .15s,box-shadow .15s;resize:none}
.field::placeholder{color:#C9A0B0}
.field:focus{border-color:var(--cereza);box-shadow:0 0 0 4px rgba(194,31,82,.12)}
.cnt{display:block;text-align:right;font-size:12px;color:#C9A0B0;margin:4px 6px 0}
.steps3{display:grid;gap:12px}
.step{display:flex;gap:12px;align-items:center}
.step .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--cereza);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px;padding-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--rosa-l);background:#fff;border-radius:999px;padding:11px 18px;font:900 15px/1 var(--body);color:var(--vino);transition:all .15s}
.chip:hover{border-color:var(--malva)}
.chip[aria-pressed=true]{background:var(--vino);border-color:var(--vino);color:#fff;box-shadow:0 3px 0 #3E0616}
.chip[aria-pressed=true]::before{content:"✦ ";color:var(--oro)}
.sub{font:900 12px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--frambuesa);margin:24px 0 10px 4px}
.fmts{display:grid;gap:10px}
.fmt{text-align:left;border:2px solid var(--rosa-l);background:#fff;border-radius:18px;padding:14px 16px 13px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;transition:all .15s}
.fmt:hover{border-color:var(--malva)}
.fmt b{font:400 24px/1 var(--display);font-weight:900;text-transform:uppercase;color:var(--vino);letter-spacing:.01em}
.fmt span{font-size:14px;color:var(--texto-2);grid-column:1/-1;grid-row:2}
.fmt .dots{grid-column:2;grid-row:1;display:flex;gap:3px}
.fmt .dots i{width:8px;height:8px;border-radius:50%;background:var(--rosa-l)}
.fmt .dots i.on{background:var(--cereza)}
.fmt .ord{grid-column:2;grid-row:3;font:900 10px/1 var(--body);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--cereza);border-radius:999px;padding:5px 9px 4px;justify-self:end;display:none}
.fmt[aria-pressed=true] .ord{display:block}
.fmt[aria-pressed=true]{border-color:var(--cereza);background:var(--rosa-xl);box-shadow:0 0 0 3px rgba(194,31,82,.12)}
.fmt small{grid-column:1;grid-row:3;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--frambuesa);font-weight:900;margin-top:4px}

.actions{position:sticky;bottom:0;margin:auto -2px 0;padding:20px 2px 2px;background:linear-gradient(rgba(255,255,255,0),#fff 30%);display:flex;align-items:center;gap:14px}
.btn{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:999px;padding:14px 30px 11px;transition:transform .1s,opacity .2s;line-height:1}
.btn.pri{background:var(--vino);color:#fff;box-shadow:0 4px 0 #3E0616}
.btn.sec{background:var(--rosa);color:var(--vino);box-shadow:0 4px 0 var(--malva)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3E0616}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
.actions .btn.pri{flex:1}
.back{background:none;border:0;color:var(--frambuesa);font:900 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;padding:12px 4px}
.btn-big{width:100%}

/* Intro */
.intro{justify-content:center;text-align:left}
.intro .gift{width:120px;margin:0 0 6px -4px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.intro h1{font-size:clamp(44px,13vw,72px);margin:12px 0 16px}
.intro .q-help{font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 26px}
.tag{display:inline-block;padding:7px 13px;border-radius:999px;background:var(--rosa-l);color:var(--frambuesa);font:900 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase}

/* Loading */
.load{justify-content:center;align-items:center;text-align:center}
.load img{width:130px;animation:wig .7s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.06)}}
.load h2{font-size:36px;margin:20px 0 8px}
.load p{color:var(--texto-2)}

/* Resultado */
.res-head{padding-bottom:6px}
.res-title{font-size:clamp(38px,10.5vw,64px);margin:12px 0 8px;line-height:.92}
.res-sub{font-size:18px;color:var(--texto-2);max-width:640px}
.otros{margin:18px 0 0}
.otros .chips{margin-top:8px}
.otros .chip{font-size:13px;padding:9px 14px;text-align:left;line-height:1.2}
.pitch{margin:22px 0 4px;background:var(--rosa-xl);border-radius:20px;padding:18px 20px;color:var(--vino);font-size:17px}
.pitch b{color:var(--cereza)}
.grid{display:grid;gap:16px;margin-top:18px}
.card{border:2px solid var(--rosa-l);border-radius:22px;padding:20px 20px 18px;background:#fff;animation:in .5s both}
.card h3{font-size:27px;margin-bottom:12px}
.card h3 small{display:block;font:900 10px/1 var(--body);letter-spacing:.26em;color:var(--frambuesa);margin-bottom:7px}
.row{padding:9px 0;border-top:1px dashed var(--rosa-l)}
.row:first-of-type{border-top:0;padding-top:0}
.row dt{font:900 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--frambuesa);margin-bottom:5px}
.row dd{margin:0;color:var(--vino);font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{background:var(--rosa-l);color:var(--frambuesa);border-radius:999px;padding:5px 11px;font:900 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.mod{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.mod .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--cereza);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:17px;padding-top:2px}
.tip{background:var(--rosa-xl);border-radius:16px;padding:13px 15px;color:var(--texto-2);font-size:15px;margin-top:12px}
.tip b{color:var(--vino)}
.tip.warn{background:#FFF3E2}
.nolist{margin:8px 0 0;padding:0;list-style:none;color:var(--texto-2);font-size:15px}
.nolist li{padding:3px 0 3px 22px;position:relative}
.nolist li::before{content:"✕";position:absolute;left:2px;color:var(--malva);font-size:12px;top:6px;font-weight:900}
.price{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.price .big{font-family:var(--display);font-weight:900;font-size:64px;line-height:.85;color:var(--cereza)}
.price .big small{display:block;font:900 10px/1 var(--body);letter-spacing:.24em;color:var(--frambuesa);margin-bottom:6px;text-transform:uppercase}
.price .old{font-family:var(--display);font-weight:900;font-size:34px;color:var(--malva);line-height:.9;padding-bottom:2px}
.price .old small{display:block;font:900 10px/1 var(--body);letter-spacing:.24em;color:var(--frambuesa);margin-bottom:6px}
.tl{position:relative;margin:4px 0 0}
.tl .it{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:0 0 16px;position:relative}
.tl .it::before{content:"";position:absolute;left:16px;top:34px;bottom:2px;width:2px;background:var(--rosa-l)}
.tl .it:last-child::before{display:none}
.tl .dot{width:34px;height:34px;border-radius:50%;background:var(--cereza);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:17px;padding-top:2px}
.tl .when{font:900 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--frambuesa);margin:3px 0 4px}
.tl p{font-size:15.5px;color:var(--vino)}
.tl p span{color:var(--texto-2)}
.copybox{background:var(--rosa-xl);border-radius:16px;padding:14px 15px;margin-top:8px;font-size:15px;color:var(--vino);white-space:pre-wrap}
.cbtn{margin-top:8px;border:0;background:var(--rosa);color:var(--vino);border-radius:999px;padding:9px 16px 8px;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 3px 0 var(--malva)}
.cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--malva)}
.sig{display:grid;gap:8px;margin-top:6px}
.sig div{display:flex;gap:10px;font-size:15px;color:var(--texto-2)}
.sig i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;border-top:1px dashed var(--rosa-l);font-size:16px}
.chk:first-of-type{border-top:0}
.chk input{position:absolute;opacity:0}
.chk .bx{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--malva);display:grid;place-items:center;color:transparent;font-weight:900;transition:all .15s;margin-top:1px}
.chk input:checked+.bx{background:var(--cereza);border-color:var(--cereza);color:#fff}
.chk input:checked~span{text-decoration:line-through;color:#C9A0B0}
.chk input:focus-visible+.bx{box-shadow:0 0 0 4px rgba(194,31,82,.2)}
.prog{font:900 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--frambuesa);margin-bottom:8px}

/* CTA */
.cta{margin-top:22px;border-radius:26px;background:var(--vino);color:#fff;padding:30px 24px 26px;position:relative;overflow:hidden;animation:in .6s both}
.cta .eyebrow{color:var(--rosa)}
.cta h2{color:#fff;font-size:clamp(36px,9.6vw,58px);margin:10px 0 14px}
.cta h2 em{font-style:normal;color:var(--rosa)}
.cta p{color:#F6DDE6;font-size:17px;max-width:620px}
.cta .keep{margin-top:16px;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;color:#fff;font-size:15px}
.cta .keep b{color:var(--oro)}
.cta ul{list-style:none;padding:0;margin:18px 0 22px;display:grid;gap:10px;max-width:620px}
.cta li{display:flex;gap:12px;align-items:flex-start;color:#fff;font-size:16px}
.cta li i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--rosa);color:var(--vino);display:grid;place-items:center;font:400 16px/1 var(--display);font-weight:900;padding-top:2px;font-style:normal}
.cta .btn{display:block;width:100%;text-decoration:none;font-size:23px;padding:17px 20px 14px;text-align:center;white-space:nowrap}
.cta .spk{opacity:.9}
.foot{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 4px;align-items:center}
.foot .btn{font-size:17px;padding:12px 22px 9px}
.ghost{background:none;border:2px solid var(--rosa-l);color:var(--frambuesa)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--vino);color:#fff;padding:12px 20px;border-radius:999px;font:900 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;transition:all .25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- ESCRITORIO ---------- */
@media(min-width:900px){
  .wrap{padding:max(36px,6vh) 6vw}
  .sheet{flex-direction:row;border-radius:34px;min-height:calc(100dvh - 2*max(36px,6vh))}
  .rail{display:none}
  .rail-d{width:300px;flex:none;border-right:2px solid var(--rosa-l)}
  .rail-in{display:flex;flex-direction:column;padding:34px 28px 28px;position:sticky;top:0;max-height:100dvh;overflow:auto}
  .rail-d .dia{font-family:var(--display);font-size:92px;line-height:.82;color:var(--rosa)}
  .rail-d .dia small{display:block;font:900 12px/1 var(--body);letter-spacing:.28em;color:var(--frambuesa);margin-bottom:6px}
  .rail-d .gift{width:150px;margin:14px 0 6px -6px}
  .rail-d h4{font:900 11px/1.3 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--frambuesa);margin:12px 0 12px}
  .nav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
  .nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:7px 8px;border-radius:12px;color:#C9A0B0;font:400 15px/1.2 var(--body)}
  .nav button .c{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--rosa-l);display:grid;place-items:center;font:900 11px/1 var(--body);color:var(--malva)}
  .nav li.done button{color:var(--texto-2)}
  .nav li.done .c{background:var(--cereza);border-color:var(--cereza);color:#fff}
  .nav li.cur button{background:var(--rosa-xl);color:var(--vino);font-weight:900}
  .nav li.cur .c{border-color:var(--cereza);color:var(--cereza)}
  .nav button:disabled{cursor:default}
  .stage{padding:56px 64px 40px}
  .m-only{display:none}
  .q-title{font-size:clamp(46px,4.6vw,66px)}
  .q-help{font-size:18px}
  .q-body{margin-top:30px}
  .actions{position:static;background:none;margin:34px 0 0;padding:0;max-width:640px}
  .actions .btn.pri{flex:none}
  .intro h1{font-size:clamp(60px,6.6vw,96px)}
  .intro .gift{width:150px}
  .fmts{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr 1fr;gap:18px}
  .grid .wide{grid-column:1/-1}
  .res-title{font-size:clamp(50px,5.4vw,78px)}
  .cta{padding:44px 48px 40px}
  .cta-in{max-width:700px}
  .cta .btn{font-size:26px;display:inline-block;width:auto;padding:17px 36px 14px}
  .sheet>.spk{display:block}
}
@media(min-width:1180px){.sheet{border-radius:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  const fl=list(S.formatos.map(id=>F[id].n));
  const P=ex.length?`un kit con ${fl}`:`${f.art} ${f.n}`;
  const aud=strip(S.aud),idea=strip(S.idea),transf=strip(S.transf),mito=strip(S.mito),origen=strip(S.origen),prob=strip(S.prob);
  const pasos=S.pasos.map(strip);
  const nombres=[
    {t:`${cap(fl)} para ${aud}`,s:`Para que puedas ${transf}`},
    {t:`${cap(idea)}, paso a paso`,s:`${cap(fl)} para ${aud}`},
    {t:`3 pasos para ${idea}`,s:`Para que puedas ${transf}`}
  ];
  const nm=nombres[S.nameIdx]||nombres[0];
  const n=S.costos.length,dinero=S.costos.includes('Dinero')||S.costos.includes('Oportunidades');
  const sc=Math.min(1,(n-1)*0.4+(dinero?0.2:0));
  const regular=rnd(f.pr[0]+(f.pr[1]-f.pr[0])*sc+ex.reduce((a,e)=>a+e.pr[0]*0.6,0));
  const lanz=Math.min(regular-1,rnd(regular*0.7));
  const avail=T[S.tiempo].d;
  const dias=f.dias+ex.reduce((a,e)=>a+e.dias*0.5,0);
  const corto=dias>avail;
  const pitch=`${cap(P)} para ${aud}, para que puedas ${transf} en 3 pasos.`;
  const dm=`Hola ✨ estoy armando ${P} para ${aud} y me encantaría tu opinión.\n\nUna pregunta: ¿qué es lo que más se te complica hoy en esto?\n\nSi quieres, te cuento cómo va y te dejo ver la primera versión antes que nadie 💌`;
  const hooks=[
    {w:'Día 1 · El mito',h:`Te dijeron: «${mito}». Esto es lo que nadie te cuenta.`,c:'Desarma el mito con tu historia y cierra con una pregunta.'},
    {w:'Día 2 · Tu historia',h:`Yo estuve ahí cuando ${origen}.`,c:`Cuenta qué cambió y por qué ahora lo estás convirtiendo en ${P}.`},
    {w:'Día 3 · Los 3 pasos',h:`3 pasos para ${idea}: ${list(pasos.map(low))}.`,c:`Ciérralo con: «¿Te armo ${P} con esto? Comenta QUIERO».`}
  ];
  const checks=[
    'Guarda esta propuesta (cópiala a tu Notion o a tus notas).',
    'Publica los 3 contenidos de la prueba.',
    'Escribe a 10 personas de tu público con el mensaje directo.',
    `Abre una lista de espera o una preventa a $${lanz} USD.`,
    'Cuenta señales: 10 interesadas o 3 reservas. Si las hay, empieza a crear.'
  ];
  return {f,ex,fl,P,dias,aud,idea,transf,mito,origen,prob,pasos,nombres,nm,regular,lanz,corto,pitch,dm,hooks,checks,costos:S.costos.map(c=>c.toLowerCase())};
}
function plain(){
  const p=build();
  return [
`MI PROPUESTA DE PRODUCTO DIGITAL
Día 11 · Calendario de Adviento para Creadoras
`,
`NOMBRE DE TRABAJO: ${p.nm.t}
${p.nm.s}
`,
`MI OFERTA EN UNA FRASE
${p.pitch}
`,
`PARA QUIÉN: ${p.aud}
SU PROBLEMA: ${p.prob}

/* ---------- render ---------- */
const stage=$('#stage');
function railHTML(){
  const step=typeof view==='number'?view:(view==='result'||view==='loading'?Q.length:-1);
  const m=(view==='intro')?`<div class="m-head"><img src="${GIFT}" alt=""><div class="dia"><small>DÍA</small>11</div></div>`:
   `<div class="m-head"><img src="${GIFT}" alt=""><div class="dia"><small>DÍA</small>11</div><div class="qn">${view==='result'?'Tu propuesta':(step<Q.length?`Pregunta ${step+1} de ${Q.length}`:'Casi lista')}</div></div>
    <div class="bar" aria-hidden="true">${Q.map((_,i)=>`<i class="${i<step||view==='result'?'on':''}"></i>`).join('')}</div>`;
  $('#railM').innerHTML=m;
  const items=Q.map((q,i)=>{
    const done=view==='result'||view==='loading'||i<step||(typeof view==='number'&&valid(i)&&i<firstOpen());
    const cur=i===step;
    const can=typeof view==='number'?(i<=Math.max(step,firstOpen())&&i!==step):(view==='result'&&valid(i));
    return `<li class="${done?'done':''} ${cur?'cur':''}"><button data-go="${i}" ${can?'':'disabled'}><span class="c">${done?'✓':i+1}</span>${q.lab}</button></li>`;
  }).join('')+`<li class="${view==='result'?'cur':''}"><button disabled><span class="c">★</span>Tu propuesta</button></li>`;
  $('#railD').innerHTML=`<div class="rail-in"><div class="dia"><small>DÍA</small>11</div><img class="gift" src="${GIFT}" alt="Regalo 11"><h4>Tu primer producto digital</h4><ul class="nav">${items}</ul></div>`;
}
function setStage(html,after,cls=''){
  stage.innerHTML=`<div class="scr ${cls}">${html}</div>`;
  railHTML();
  window.scrollTo({top:0,behavior:'auto'});
  if(after)after();
}
function go(v){view=v;render()}
function render(){
  if(view==='intro')return intro();
  if(view==='loading')return loading();
  if(view==='result')return result();
  return question(view);
}

function intro(){
  const resume=firstOpen();
  const has=resume>0&&resume<=Q.length;
  setStage(`
   <img class="gift" src="${GIFT}" alt="">
   <span class="eyebrow">Creadora, abre tu regalo del día</span>
   <h1>ANTES DE CREARLO, DISÉÑALO</h1>
   <p class="q-help">Respóndeme 9 preguntas sobre tu idea y sal con el nombre, la oferta, la primera versión, un precio inicial y una prueba para saber si alguien lo quiere.</p>
   <div class="meta"><span class="tag">9 preguntas</span><span class="tag">10 minutos (aprox.)</span><span class="tag">Se queda en tu navegador</span></div>
   <div class="actions" style="margin-top:0"><button class="btn pri" data-act="start">${has?'Seguir donde me quedé':'Empezar'}</button>${has?'<button class="back" data-act="restart">Empezar de nuevo</button>':''}</div>
  `,null,'intro');
}

function inputHTML(q,i){
  if(q.kind==='line')return `<label class="lead" for="f">${q.lead}</label><input class="field" id="f" data-k="${q.k}" maxlength="${q.max}" autocomplete="off" placeholder="${esc(q.ph)}" value="${esc(S[q.k])}">`;
  if(q.kind==='area')return `<label class="lead" for="f">${q.lead}</label><textarea class="field" id="f" data-k="${q.k}" rows="3" maxlength="${q.max}" placeholder="${esc(q.ph)}">${esc(S[q.k])}</textarea><span class="cnt"><span id="cn">${S[q.k].length}</span> / ${q.max}</span>`;
  if(q.kind==='chips')return `<div class="chips">${q.opts.map(o=>`<button class="chip" data-chip="${o}" aria-pressed="${S.costos.includes(o)}">${o}</button>`).join('')}</div>`;
  if(q.kind==='steps')return `<div class="steps3">${[0,1,2].map(j=>`<div class="step"><span class="n">${j+1}</span><input class="field" data-p="${j}" maxlength="70" autocomplete="off" placeholder="${esc(q.ph[j])}" value="${esc(S.pasos[j])}"></div>`).join('')}</div>`;
  if(q.kind==='format')return `<div class="fmts">${Object.entries(F).map(([id,f])=>{const o=S.formatos.indexOf(id);return `<button class="fmt" data-fmt="${id}" aria-pressed="${o>-1}"><b>${f.nm}</b><span>${f.d}</span><span class="dots" aria-hidden="true">${[1,2,3,4,5].map(x=>`<i class="${x<=f.e?'on':''}"></i>`).join('')}</span><small>${f.txt}</small><em class="ord">${o>-1?(o===0?'Principal':'Bonus'):''}</em></button>`}).join('')}</div>
   <div class="sub">¿Cuánto tiempo tienes para crear tu primera versión?</div>
   <div class="chips">${Object.entries(T).map(([id,t])=>`<button class="chip" data-t="${id}" aria-pressed="${S.tiempo===id}">${t.n}</button>`).join('')}</div>`;
}
function question(i){
  const q=Q[i],last=i===Q.length-1;
  setStage(`
   <span class="eyebrow">Pregunta ${i+1} de ${Q.length}</span>
   <h2 class="q-title">${q.t}</h2>
   <p class="q-help">${q.h}</p>
   <div class="q-body">${inputHTML(q,i)}</div>
   <div class="actions"><button class="back" data-act="back">← Atrás</button><button class="btn pri" id="nx" data-act="next" ${valid(i)?'':'disabled'}>${last?'Ver mi propuesta':'Siguiente'}</button></div>
  `,()=>{if(window.innerWidth>=900){const f=stage.querySelector('.field');if(f){f.focus({preventScroll:true});const l=f.value.length;try{f.setSelectionRange(l,l)}catch(e){}}}});
}
function refreshNext(){const b=$('#nx');if(b&&typeof view==='number')b.disabled=!valid(view)}

function loading(){
  const msgs=['Envolviendo tu idea…','Poniéndole nombre…','Calculando un precio inicial…','Armando tu prueba de interés…'];
  setStage(`<img src="${GIFT}" alt=""><h2>Un momento, creadora ✨</h2><p id="lm">${msgs[0]}</p>`,null,'load');
  let k=0;const iv=setInterval(()=>{k++;const el=$('#lm');if(el&&k<msgs.length)el.textContent=msgs[k]},620);
  setTimeout(()=>{clearInterval(iv);if(view==='loading')go('result')},2500);
}

function result(){
  const p=build();

  setStage(`

    <div class="otros"><span class="eyebrow" style="letter-spacing:.2em">Otros nombres para probar</span><div class="chips">${p.nombres.map((n,i)=>i===S.nameIdx?'':`<button class="chip" data-name="${i}">${esc(n.t)}</button>`).join('')}</div></div>

     </dl>
     <div class="tip"><b>Úsalo así:</b> el mito es tu gancho y tu historia es la prueba de que sabes de lo que hablas. Eso es lo que hace que te compren a ti y no a otra.</div></section>
    <section class="card wide" style="animation-delay:.15s"><h3><small>03 · Tu primera versión</small>${esc(cap(p.fl))}: solo lo esencial</h3>
     ${p.pasos.map((x,i)=>`<div class="mod"><span class="n">${i+1}</span><div>${esc(x)}</div></div>`).join('')}
     <div class="tip"><b>${p.ex.length?'Principal · '+esc(p.f.n):'Qué entregas'}:</b> ${esc(p.f.v1)}</div>
     ${p.ex.map(e=>`<div class="tip"><b>Bonus · ${esc(e.n)}:</b> ${esc(e.v1)}</div>`).join('')}
     ${p.corto?`<div class="tip warn"><b>Ojo con el tiempo:</b> esta combinación pide ${Math.round(p.dias)} días (aprox.) y tú tienes ${T[S.tiempo].n}. ${esc(p.f.recorte||'Quita un bonus y empieza solo con lo principal.')}${p.ex.length?' O quita un bonus.':''}</div>`:`<div class="tip"><b>Tu tiempo alcanza:</b> con ${T[S.tiempo].n} puedes terminarlo. No lo alargues.</div>`}
     <div class="sub" style="margin-top:18px">Todavía no necesitas</div>
     <ul class="nolist">${p.f.no.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
    <section class="card" style="animation-delay:.2s"><h3><small>04 · Precio</small>Tu precio inicial</h3>
     <div class="price"><div class="big"><small>Lanzamiento</small>$${p.lanz}</div><div class="old"><small>Después</small>$${p.regular}</div></div>
     <div class="tip">Precios en dólares (USD), como punto de partida. Lo que le cuesta el problema (${esc(list(p.costos))}) es lo que justifica tu precio; el mercado te dirá el resto.</div></section>
    <section class="card" style="animation-delay:.25s"><h3><small>05 · Tus próximos 7 días</small>Checklist</h3>
     <div class="prog" id="prog">${pct} de ${p.checks.length} listas</div>
     ${p.checks.map((c,i)=>`<label class="chk"><input type="checkbox" data-chk="${i}" ${S.done.includes(i)?'checked':''}><span class="bx">✓</span><span>${esc(c)}</span></label>`).join('')}</section>
    <section class="card wide" style="animation-delay:.3s"><h3><small>06 · Prueba de interés</small>Antes de crearlo, pregunta</h3>

      <div class="it"><span class="dot">4</span><div><div class="when">Día 4 · Mensajes directos</div><p><span>Escríbele esto a 10 personas de tu público:</span></p><div class="copybox" id="dmx">${esc(p.dm)}</div><button class="cbtn" data-copy="dm">Copiar mensaje</button></div></div>

     <svg class="spk" style="top:18px;right:22px" width="26" height="26" viewBox="-12 -12 24 24"><path d="M0-11Q0 0 11 0Q0 0 0 11Q0 0-11 0Q0 0 0-11Z" fill="#F5B83D"/></svg>

   <div class="foot"><button class="btn pri" data-copy="all">Copiar mi propuesta</button><button class="btn ghost" data-act="restart">Hacer otra</button></div>
  `);
}

/* ---------- eventos ---------- */
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1700)};
function copy(text){
  const ok=()=>toast('Copiado ✨');
  const fb=()=>{const a=document.createElement('textarea');a.value=text;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Selecciona y copia a mano')}a.remove()};
  try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-chip],[data-fmt],[data-t],[data-go],[data-name],[data-copy]');if(!b)return;
  const a=b.dataset.act;
  if(a==='start'){go(firstOpen()>=Q.length?0:Math.max(0,firstOpen()))}
  else if(a==='restart'){S={idea:'',aud:'',prob:'',costos:[],transf:'',mito:'',origen:'',pasos:['','',''],formatos:[],tiempo:'',nameIdx:0,done:[]};save();go(0)}
  else if(a==='back'){go(view===0?'intro':view-1)}
  else if(a==='next'){if(typeof view==='number'&&valid(view)){save();view===Q.length-1?go('loading'):go(view+1)}}
  else if(b.dataset.chip){const o=b.dataset.chip,ix=S.costos.indexOf(o);ix>-1?S.costos.splice(ix,1):S.costos.push(o);b.setAttribute('aria-pressed',S.costos.includes(o));save();refreshNext()}
  else if(b.dataset.fmt){const id=b.dataset.fmt,ix=S.formatos.indexOf(id);
    if(ix>-1)S.formatos.splice(ix,1);else if(S.formatos.length>=3){toast('Máximo 3 para no complicarte')}else S.formatos.push(id);
    document.querySelectorAll('[data-fmt]').forEach(x=>{const o=S.formatos.indexOf(x.dataset.fmt);x.setAttribute('aria-pressed',o>-1);x.querySelector('.ord').textContent=o>-1?(o===0?'Principal':'Bonus'):''});save();refreshNext()}
  else if(b.dataset.t){S.tiempo=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',x===b));save();refreshNext()}
  else if(b.dataset.go!==undefined){go(+b.dataset.go)}
  else if(b.dataset.name!==undefined){S.nameIdx=+b.dataset.name;save();result()}
  else if(b.dataset.copy==='dm'){copy(build().dm)}
  else if(b.dataset.copy==='all'){copy(plain())}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){S[t.dataset.k]=t.value;const c=$('#cn');if(c)c.textContent=t.value.length;save();refreshNext()}
  else if(t.dataset.p!==undefined){S.pasos[+t.dataset.p]=t.value;save();refreshNext()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.chk!==undefined){const i=+t.dataset.chk,ix=S.done.indexOf(i);t.checked?(ix<0&&S.done.push(i)):(ix>-1&&S.done.splice(ix,1));save();$('#prog').textContent=S.done.length+' de 5 listas'}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('input.field')&&typeof view==='number'){e.preventDefault();const b=$('#nx');if(b&&!b.disabled)b.click()}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.matches('textarea')){const b=$('#nx');if(b&&!b.disabled)b.click()}
});

render();
</script>
