  :root{
    --fondo:#5C0A22; --burdeos:#6B0F2B; --rosa:#F18BC4; --empolvado:#D9899E; --crema:#FFEFD9; --frambuesa:#A3254F; --claro:#F9CFDB;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#5C0A22;color:var(--crema);font-family:'Agrandir','DM Sans',system-ui,sans-serif;min-height:100%}
  .mundo{position:relative;width:100%;min-height:100vh;min-height:100svh;overflow:hidden;background:#5C0A22;display:flex;align-items:flex-end}
  .escena{width:min(100%,780px);height:auto;display:block;margin:0 auto;overflow:visible}
  header{position:absolute;top:clamp(36px,7vh,76px);left:0;right:0;text-align:center;z-index:2;padding:0 16px;pointer-events:none;text-shadow:0 2px 12px rgba(40,0,14,.6)}
  header h1{line-height:1;display:flex;flex-direction:column;align-items:center;gap:2px}
  header .t1{font-family:'Londrina Solid','Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(25px,7.7vw,58px);letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap}
  header .t2{font-family:'Agrandir',system-ui,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(15px,4.2vw,28px);letter-spacing:.08em;line-height:1;color:#F18BC4;margin-top:8px}
  header p{margin-top:6px;font-size:15px;color:var(--claro)}
  .escena text,#fx text{font-family:'Poppins',system-ui,sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}



  /* ---------- contador a Navidad ---------- */
  .cuenta{margin-bottom:0}
  .cuenta-t{font-family:'Poppins',system-ui,sans-serif;font-weight:300;text-transform:uppercase;font-size:clamp(11px,2.9vw,14px);letter-spacing:.42em;padding-left:.42em;color:#F9CFDB;margin-bottom:12px}
  .cuenta-n{display:flex;justify-content:center;align-items:flex-start;gap:clamp(6px,2vw,16px)}
  .cuenta .c{display:flex;flex-direction:column;align-items:center;min-width:clamp(52px,13vw,80px)}
  .cuenta b{font-family:'Agrandir',system-ui,sans-serif;font-weight:400;font-size:clamp(34px,9.6vw,46px);line-height:1;color:#FFEFD9;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .cuenta .seg b{color:#F18BC4}
  .cuenta .c span{margin-top:5px;font-family:'Agrandir',system-ui,sans-serif;font-size:clamp(9.5px,2.4vw,12px);letter-spacing:.12em;text-transform:uppercase;color:#F9CFDB}
  .cuenta i{font-style:normal;font-family:'Agrandir',system-ui,sans-serif;font-size:clamp(28px,7.6vw,38px);line-height:1;color:#FFEFD9;opacity:.85;transform:translateY(-.04em)}
  .cuenta.fin .cuenta-n{display:none}
  .cuenta.fin .cuenta-t{font-family:'Londrina Solid',serif;font-weight:900;font-size:30px;color:#FFEFD9;margin:0}
  /* ---------- cronograma del 1 al 24 (cuenta atrás) ---------- */
  .crono{pointer-events:auto;margin:30px auto 0;width:min(94vw,560px);text-shadow:0 2px 10px rgba(40,0,14,.55)}
  .crono ol{list-style:none;display:grid;grid-template-columns:repeat(24,1fr);row-gap:8px}
  .crono li{position:relative;display:flex;justify-content:center}
  .crono li::before{content:"";position:absolute;top:50%;right:50%;width:100%;height:3px;margin-top:-1.5px;background:rgba(249,207,219,.28);border-radius:2px}
  .crono li:first-child::before{display:none}
  .crono li.pasa::before{background:#F18BC4}
  .crono button{position:relative;z-index:1;width:25px;height:25px;border-radius:50%;border:2px solid rgba(249,207,219,.55);background:#5C0A22;color:#F9CFDB;
    font:700 11px/1 'Poppins',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s ease,background .2s}
  .crono button:hover{transform:scale(1.18)}
  .crono button:focus-visible{outline:2px solid #FFEFD9;outline-offset:2px}
  .crono li.antes button{border-color:#F18BC4;color:#F18BC4}
  .crono li.abierta button{background:#F18BC4;border-color:#F18BC4;color:#5C0A22}
  .crono li.hoy button{background:#FFEFD9;border-color:#FFEFD9;color:#6B0F2B;width:31px;height:31px;font-size:13px;animation:latido 1.8s ease-in-out infinite}
  .crono li.hoy.abierta button{background:#F18BC4;border-color:#FFEFD9;color:#5C0A22}
  .crono li.nav button{border-color:#F5B83D}
  .crono li.nav:not(.abierta):not(.hoy) button{color:#F5B83D}
  @keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(255,239,217,.55)}50%{box-shadow:0 0 0 7px rgba(255,239,217,0)}}
  .crono .crono-txt{margin-top:10px;font-size:14px;letter-spacing:.03em;color:#F9CFDB;font-weight:600}
  .crono .crono-txt b{color:#FFEFD9;font-weight:700}
  @media (max-width:700px){
    .crono{width:min(94vw,404px);margin-top:26px}
    .crono .crono-txt{margin-top:8px;font-size:13px}
    .crono ol{grid-template-columns:repeat(12,1fr);row-gap:10px}
    .crono li:nth-child(12n+1)::before{display:none}
    .crono button{width:24px;height:24px;font-size:10.5px}
    .crono li.hoy button{width:29px;height:29px;font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){ .crono li.hoy button{animation:none} }
  .win{cursor:pointer;outline:none}
  .win .marco{transform-box:fill-box;transform-origin:center;transition:transform .18s ease}
  .win:hover .marco,.win:focus-visible .marco{transform:scale(1.07)}
  .win:focus-visible .frame{stroke:#FFEFD9;stroke-width:5}
  .win.sacudir .marco{animation:sacudir .45s ease}
  @keyframes sacudir{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}

    transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.25,1)}

    box-shadow:0 0 0 1.5px #F18BC4,0 3px 8px rgba(92,10,34,.25);transition:transform .18s ease,background .18s ease,color .18s ease}

/* ---- recorte "papel cortado a mano" ---- */
function wob(pts, j, seg){
  const out=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const n=Math.max(1,Math.round(len/seg));
    for(let k=0;k<n;k++){
      const t=k/n, jj = k===0 ? j : j*0.7;
      out.push([a[0]+(b[0]-a[0])*t+(rnd()-.5)*2*jj, a[1]+(b[1]-a[1])*t+(rnd()-.5)*2*jj]);
    }
  }
  return 'M'+out.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';
}
function cut(pts, fill, parent, j=1.6, extra){ return el('path', {d:wob(pts,j,40), fill, ...(extra||{})}, parent); }
const R4 = (x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function box(x,y,w,h,fill,parent,j=1.4,extra){ return cut(R4(x,y,w,h), fill, parent, j, extra); }
function sparkle(parent,x,y,r,fill,extra){
  return el('path', {d:`M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z`, fill, ...(extra||{})}, parent);
}
function star8(parent,cx,cy,R,r,fill){
  const pts=[]; for(let i=0;i<16;i++){ const a=i*Math.PI/8-Math.PI/2, rr=i%2?r:R; pts.push([cx+rr*Math.cos(a), cy+rr*Math.sin(a)]); }
  return cut(pts, fill, parent, 1.1);
}

// montañas (dos capas con cumbres nevadas)
function montanas(color, cap, baseY, pMin, pMax, step){
  const pts=[];
  for (let x=X0-step; x<=X1+step; x+=step){
    pts.push([x, baseY - (30 + rnd()*60), false]);
    pts.push([x + step*(0.38+rnd()*0.24), baseY - (pMin + rnd()*(pMax-pMin)), true]);
  }
  const poly = [[X0-step, baseY+500+DY], ...pts, [X1+step, baseY+500+DY]];
  el('path', {d:wob(poly,2,60), fill:color});
  pts.forEach((P,i)=>{
    if(!P[2] || i===0 || i===pts.length-1) return;
    const L=pts[i-1], R=pts[i+1], f=0.3;
    const PL=[P[0]+(L[0]-P[0])*f, P[1]+(L[1]-P[1])*f], PR=[P[0]+(R[0]-P[0])*f, P[1]+(R[1]-P[1])*f];
    const zz=[]; for(let t=0;t<=6;t++){ const u=t/6; zz.push([PR[0]+(PL[0]-PR[0])*u, PR[1]+(PL[1]-PR[1])*u + (t%2?14:-2)]); }
    cut([[P[0],P[1]], ...zz], cap, svg, 1);
  });
}

function bosque(color, baseY, hMin, hMax, sp, wr, verde){

    }
    if (esVerde) dv += t; else d += t;
  }
  el('path', {d, fill:color});
  if (verde) el('path', {d:dv, fill:verde});
}

function capa(g, x, y, k){ return el('g', {transform:`translate(${x} ${y}) scale(${k})`}, g); }

  return el('path', {d:`M${x} ${y+r*0.9} C${x-r*1.6} ${y-r*0.2} ${x-r*0.7} ${y-r*1.3} ${x} ${y-r*0.35} C${x+r*0.7} ${y-r*1.3} ${x+r*1.6} ${y-r*0.2} ${x} ${y+r*0.9}Z`, fill:col||'#FF5E7E'}, s);
}
function brazo(s, x1, y1, x2, y2, color, piel){
  el('path', {d:`M${x1} ${y1} L${x2} ${y2}`, stroke:color, 'stroke-width':6.5, 'stroke-linecap':'round', fill:'none'}, s);

}
function mujer(g, x, y, k, i, o={}){

  el('path', {d:'M-1.7 -36.4 Q0 -34.9 1.7 -36.4', fill:'none', stroke:'#C2304F', 'stroke-width':1.2, 'stroke-linecap':'round'}, s);
  el('circle', {cx:-7,cy:-36,r:1.3,fill:'#FFE08A'}, s); el('circle', {cx:7,cy:-36,r:1.3,fill:'#FFE08A'}, s);
  if (o.gorro){

    el('rect', {x:-8.2,y:-46.5,width:16.4,height:3.6,rx:1.8,fill:'#FFF6E6'}, s);

    el('rect', {x:-10.5,y:-42,width:4,height:7,rx:2,fill:'#2A1020'}, s); el('rect', {x:6.5,y:-42,width:4,height:7,rx:2,fill:'#2A1020'}, s);
  }
  s._ropa = ropa; s._piel = piel;
  return s;
}

function escenaVentana(g, tipo, i, gx, gy, gw, gh, k){
  const cx = gx + gw/2, suelo = gy + gh;
  const sc = (dx)=> cx + dx*Math.min(1.5, gw/72);
  const gorro = (i%3===0);
  switch(tipo){
    case 'laptop': {
      const f = mujer(g, cx, suelo, k, i, {gorro});
      const L = capa(g, cx, suelo, k);
      el('rect', {x:-17,y:-26,width:34,height:21,rx:2.5,fill:'#D9D5E3'}, L);
      el('circle', {cx:0,cy:-15.5,r:2.8,fill:'#F4F1FA'}, L);
      el('rect', {x:-21,y:-5,width:42,height:4.5,rx:2,fill:'#B3AEC2'}, L);
      break; }
    case 'selfie': {
      const f = mujer(g, sc(-8), suelo, k, i, {e:1, gorro:i%2===1});
      const s = capa(g, sc(-8), suelo, k);
      brazo(s, 9, -25, 22, -44, f._ropa, f._piel);
      movil(s, 26, -50, 12);
      corazon(s, 36, -58, 3.4); corazon(s, 31, -38, 2.4, '#FF9BD0'); corazon(s, 40, -46, 2, '#FFE08A');
      break; }
    case 'cafe': {
      const f = mujer(g, sc(-4), suelo, k, i, {e:2});
      const s = capa(g, sc(-4), suelo, k);
      brazo(s, 10, -22, 10, -30, f._ropa, f._piel);
      tazaMano(s, 12, -28);
      el('rect', {x:20,y:-22,width:20,height:3,fill:'#8A3B5C'}, s);
      planta(g, sc(24), suelo-2*k, k*0.9, 1.2);
      break; }
    case 'camara': {
      const f = mujer(g, cx, suelo, k, i, {e:3});
      const s = capa(g, cx, suelo, k);
      el('rect', {x:-11,y:-38,width:22,height:11,rx:2,fill:'#2A1020'}, s);
      el('rect', {x:-4,y:-41,width:8,height:4,rx:1,fill:'#2A1020'}, s);
      el('circle', {cx:0,cy:-32.5,r:5.2,fill:'#4A4A6A'}, s); el('circle', {cx:0,cy:-32.5,r:2.6,fill:'#9FB4FF'}, s);
      brazo(s, -11, -22, -11, -31, f._ropa, f._piel); brazo(s, 11, -22, 11, -31, f._ropa, f._piel);
      break; }
    case 'aro': {
      const R = capa(g, sc(-20), suelo, k);
      el('line', {x1:0,y1:-14,x2:0,y2:0,stroke:'#2A1020','stroke-width':2.4}, R);
      el('circle', {cx:0,cy:-30,r:15,fill:'#FFE9C2',opacity:.35}, R);
      el('circle', {cx:0,cy:-30,r:15,fill:'none',stroke:'#FFF6E6','stroke-width':3.6}, R);
      movil(R, 0, -30);
      mujer(g, sc(12), suelo, k, i, {e:4, gorro:i%2===1});
      break; }
    case 'podcast': {
      const f = mujer(g, sc(-4), suelo, k, i, {auri:true, e:2});
      const s = capa(g, sc(-4), suelo, k);
      el('path', {d:'M24 0 Q26 -22 12 -33', fill:'none', stroke:'#2A1020', 'stroke-width':2.2}, s);
      el('ellipse', {cx:11,cy:-34,rx:3.6,ry:5.6,fill:'#2A1020', transform:'rotate(25 11 -34)'}, s);
      [-36,-34,-32].forEach(y=> el('line', {x1:8.5,y1:y,x2:13,y2:y-1,stroke:'#6D7FE0','stroke-width':.8}, s));
      break; }
    case 'tripode': {
      const T = capa(g, sc(-20), suelo, k);
      [[-9],[0],[9]].forEach(([dx])=> el('line', {x1:0,y1:-26,x2:dx,y2:0,stroke:'#2A1020','stroke-width':2.2,'stroke-linecap':'round'}, T));
      movil(T, 0, -34);
      const f = mujer(g, sc(12), suelo, k, i, {e:1, gorro:true});
      const s = capa(g, sc(12), suelo, k);
      brazo(s, 10, -25, 20, -44, f._ropa, f._piel);
      corazon(s, -22, -52, 2.8);
      break; }
    case 'edicion': {
      mujer(g, sc(-18), suelo, k, i, {auri:true, e:3});
      const M = capa(g, sc(16), suelo, k);
      el('rect', {x:-17,y:-38,width:34,height:25,rx:2,fill:'#2A1238'}, M);
      el('rect', {x:-14.5,y:-35.5,width:29,height:14,fill:'#4A3E9A'}, M);
      el('polygon', {points:'-3,-33 -3,-24 5,-28.5', fill:'#FFF6E6'}, M);
      [[-14,-19,12,'#FF5E7E'],[-1,-19,9,'#FFE08A'],[9,-19,5,'#8FE3A6']].forEach(([x,y,w,c])=> el('rect', {x,y:y+2,width:w,height:3,rx:1,fill:c}, M));
      el('rect', {x:-3,y:-13,width:6,height:7,fill:'#B3AEC2'}, M); el('rect', {x:-9,y:-6,width:18,height:3.5,rx:1.5,fill:'#B3AEC2'}, M);
      break; }
    case 'colab': {
      const f1 = mujer(g, sc(-15), suelo, k, i, {e:0, gorro:i%2===0});
      const s = capa(g, sc(-15), suelo, k);
      brazo(s, 10, -25, 22, -40, f1._ropa, f1._piel);
      movil(s, 26, -44, 90);
      mujer(g, sc(17), suelo, k, i, {e:3, p:2, r:3});
      corazon(s, 40, -58, 3); corazon(s, 46, -46, 2.2, '#FF9BD0');
      break; }
    case 'plan': {
      const f = mujer(g, sc(-4), suelo, k, i, {e:1});
      const s = capa(g, sc(-4), suelo, k);
      el('rect', {x:-12,y:-16,width:21,height:13,rx:1.5,fill:CREAM}, s);
      [-13,-10,-7].forEach(y=> el('line', {x1:-9,y1:y,x2:6,y2:y,stroke:'#C9788A','stroke-width':1}, s));
      brazo(s, 10, -23, 3, -11, f._ropa, f._piel);
      el('line', {x1:3,y1:-11,x2:0,y2:-5,stroke:'#2A1020','stroke-width':1.6}, s);
      tazaMano(s, 26, -3);
      break; }
    case 'arbol': {
      arbolito(g, sc(-17), suelo, k*0.95);
      const f = mujer(g, sc(14), suelo, k, i, {e:2, gorro:true});
      const s = capa(g, sc(14), suelo, k);
      brazo(s, -10, -25, -20, -38, f._ropa, f._piel);
      movil(s, -24, -42, -80);
      break; }
    case 'luces': {
      for (let b=0;b<7;b++){ const lx = gx+4+b*(gw-8)/6, ly = gy+5+Math.sin(b*1.4)*3;
        el('circle', {cx:lx,cy:ly,r:2.6*Math.max(1,k*.9),fill:['#FF5E7E','#FFE08A','#8FE3A6','#FF9BD0'][b%4]}, g); }
      el('path', {d:`M${gx} ${gy+3} Q${cx} ${gy+14} ${gx+gw} ${gy+3}`, fill:'none', stroke:'#4A0D2B', 'stroke-width':1.2, opacity:.5}, g);
      const f = mujer(g, sc(-6), suelo, k, i, {e:4, gorro:true});
      const s = capa(g, sc(-6), suelo, k);
      brazo(s, 10, -22, 10, -30, f._ropa, f._piel); tazaMano(s, 12, -28);
      planta(g, sc(22), suelo, k, 1.4);
      break; }
  }
}

function ventanaVieja2(n, cx, top){
  const W = MOVIL ? 156 : 84, Hf = MOVIL ? 112 : 100;
  const tipo = ESCENA[n], oscura = tipo==='apagada', luz = LUZ[n%3];
  const g = el('g', {class:'win', tabindex:0, role:'button', 'aria-label':`Abrir ventana ${n}`, 'data-dia':n});
  el('rect', {x:cx-W/2-12, y:top, width:W+24, height:Hf+52, fill:'transparent'}, g);
  const m = el('g', {class:'marco'}, g);
  const fy = top+26;                       // arriba del marco
  // sombra sobre la pared
  box(cx-W/2-9+4, top+16+5, W+18, Hf+36, BURG, m, 1, {opacity:.28});
  // cornisa, marco, alféizar y ménsulas
  box(cx-W/2-9, top+16, W+18, 10, FR, m, .8);
  box(cx-W/2-4, top+12, W+8, 6, FR, m, .6);
  box(cx-W/2, fy, W, Hf, FR, m, .8, {class:'frame'});
  box(cx-W/2-8, fy+Hf, W+16, 8, FR, m, .8);
  [cx-W/2+2, cx+W/2-12].forEach(x=> el('path', {d:`M${x} ${fy+Hf+8} h10 l-2 12 h-6Z`, fill:FR}, m));
  // cristal
  const gx=cx-W/2+6, gy=fy+6, gw=W-12, gh=Hf-12, tH=Math.round(gh*0.24);
  const cp = el('clipPath', {id:'cv'+n}, defs); el('rect', {x:gx,y:gy,width:gw,height:gh}, cp);
  const vid = el('g', {class:'papel', 'clip-path':`url(#cv${n})`}, m);
  const mainY = gy+tH+5, mainH = gh-tH-5;
  if (oscura){
    el('rect', {x:gx,y:gy,width:gw,height:gh,fill:'#2A1238'}, vid);
    el('rect', {x:gx,y:mainY+mainH*0.45,width:gw*0.5,height:mainH*0.55,fill:'#3B3F8F',opacity:.8}, vid);
    el('rect', {x:gx+gw*0.1,y:mainY+mainH*0.55,width:gw*0.3,height:mainH*0.3,fill:'#7F8BEA',opacity:.55}, vid);
  } else {
    el('rect', {x:gx,y:gy,width:gw,height:tH,fill:luz[0]}, vid);
    el('rect', {x:gx,y:mainY,width:gw,height:mainH,fill:luz[1]}, vid);
    el('rect', {x:gx,y:gy+gh-Math.round(mainH*0.16),width:gw,height:Math.round(mainH*0.16)+1,fill:'#F2675A'}, vid);
    const k = mainH/62;
    escenaVentana(vid, tipo, n, gx, mainY, gw, mainH - mainH*0.16 + 2, k);
    if (tipo==='persiana'){
      const bh = mainH*0.66;
      el('rect', {x:gx,y:mainY,width:gw,height:bh,fill:'#C9788A'}, vid);
      for (let y=mainY+3; y<mainY+bh; y+=7) el('rect', {x:gx,y:y,width:gw,height:3,fill:'#8A3B5C'}, vid);
      el('rect', {x:gx,y:mainY+bh-3,width:gw,height:4,fill:'#6B2A47'}, vid);
    }
  }
  // travesaños del vidrio superior
  el('rect', {x:gx,y:gy+tH,width:gw,height:5,fill:FR}, m);
  [1,2].forEach(i=> el('rect', {x:gx+gw*i/3-2, y:gy, width:4, height:tH, fill:FR}, m));
  // nieve en el alféizar
  el('path', {d:`M${cx-W/2-7} ${fy+Hf} q6 -8 13 -2 q8 -7 15 -1 q9 -8 16 0 q9 -6 15 1 q8 -6 14 2 q6 -4 11 2 V${fy+Hf+2} H${cx-W/2-7}Z`, fill:CREAM}, m);
  // número en el dintel
  const r = MOVIL ? 21 : 15;
  el('circle', {cx, cy:top+17, r, fill:BURG, opacity:.3, transform:'translate(1.5 2.5)'}, m);
  el('circle', {cx, cy:top+17, r, fill:CREAM}, m);
  el('circle', {cx, cy:top+17, r, fill:'none', stroke:BERRY, 'stroke-width':2}, m);
  const tx = el('text', {x:cx, y:top+18, fill:BURG, style:`font-size:${MOVIL?24:17}px`}, m); tx.textContent = n;
  // marca de ventana ya abierta
  const mk = el('g', {class:'marca'}, m);
  el('circle', {cx:cx+W/2+3, cy:fy+6, r:12, fill:BERRY}, mk);
  sparkle(mk, cx+W/2+3, fy+6, 7.5, CREAM);
  ventanas[n] = g;
}
function star5(parent,cx,cy,R,fill){
  const pts=[]; for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, rr=i%2?R*0.42:R; pts.push(`${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`); }
  return el('polygon', {points:pts.join(' '), fill}, parent);
}
function hatch(px,py,pw,ph,parent,col,op){
  for(let k=-ph;k<pw;k+=6) el('line', {x1:px+k,y1:py+ph,x2:px+k+ph,y2:py,stroke:col,'stroke-width':1.4,opacity:op}, parent);
}
/* Los 12 estampados de referencia, dibujados en vectorial (cubren cualquier tamaño) */
const PAT = {
  tartan(c,px,py,pw,ph,g){
    el('rect', {x:px,y:py,width:pw,height:ph,fill:c.base}, g);
    for (let ox=0; ox<pw; ox+=88) for (let oy=0; oy<ph; oy+=80){
      const x0=px+ox, y0=py+oy;
      [6,52].forEach(dx=>el('rect', {x:x0+dx,y:y0,width:24,height:80,fill:c.band}, g));
      [4,46].forEach(dy=>el('rect', {x:x0,y:y0+dy,width:88,height:22,fill:c.band}, g));
      [6,52].forEach(dx=>[4,46].forEach(dy=>el('rect', {x:x0+dx,y:y0+dy,width:24,height:22,fill:c.cross}, g)));
      [36,84].forEach(dx=>el('rect', {x:x0+dx,y:y0,width:3,height:80,fill:c.line}, g));
      [32,74].forEach(dy=>el('rect', {x:x0,y:y0+dy,width:88,height:3,fill:c.line}, g));
    }
    hatch(px,py,pw,ph,g,BURG,.16);
  },
  gingham4(c,px,py,pw,ph,g){
    for (let j=0;j<Math.ceil(ph/24);j++) for (let i=0;i<Math.ceil(pw/24);i++)
      el('rect', {x:px+i*24,y:py+j*24,width:24,height:24,fill: j%2===0 ? (i%2===0?c.a:c.b) : (i%2===0?c.c:c.d)}, g);
  },
  plaid(c,px,py,pw,ph,g){
    el('rect', {x:px,y:py,width:pw,height:ph,fill:c.base}, g);
    for (let ox=0; ox<pw; ox+=88) for (let oy=0; oy<ph; oy+=80){
      const x0=px+ox, y0=py+oy;

function loopsBow(g, cx, cy, col, tipo){
  const a = {stroke:col, 'stroke-width':3.2, 'stroke-linecap':'round', 'stroke-linejoin':'round', fill:'none'};
  const P = (d, flip)=> el('path', {d, ...a, transform: flip ? `translate(${cx} ${cy}) scale(-1 1)` : `translate(${cx} ${cy})`}, g);
  if (tipo===4){
    [false,true].forEach(f=>{
      P('M0 0 C-5 -30 -28 -40 -32 -26 C-35 -13 -12 -6 0 0', f);
      P('M0 0 C-14 -12 -44 -20 -44 -9 C-44 3 -20 1 0 0', f);
    });
  } else {
    [false,true].forEach(f=>{
      P('M0 0 C-8 -22 -30 -26 -29 -13 C-28 -3 -10 -2 0 0', f);
      P('M0 0 C-10 8 -30 14 -27 22 C-24 29 -8 12 0 0', f);
      P(`M0 0 L${-12} 30`, f);
    });
  }
  el('circle', {cx, cy, r:3.2, fill:col}, g);
}
function flor(g, cx, cy, r, c1, c2){
  for (let a=0;a<8;a++) el('ellipse', {cx, cy:cy-r*0.55, rx:r*0.3, ry:r*0.55, fill:c1, transform:`rotate(${a*45} ${cx} ${cy})`}, g);
  for (let a=0;a<8;a++) el('ellipse', {cx, cy:cy-r*0.28, rx:r*0.16, ry:r*0.3, fill:c2, transform:`rotate(${a*45+22} ${cx} ${cy})`}, g);
  el('circle', {cx, cy, r:r*0.14, fill:c2}, g);
}
/* ---- cajas especiales (nuevas referencias) ---- */
const ROJO_NAV = '#C8171A';
function rayosPompon(u, cx, cy, R, col, n){
  for (let i=0;i<n;i++){
    const a0 = Math.PI + (i/n)*Math.PI, a1 = Math.PI + ((i+.62)/n)*Math.PI;
    el('path', {d:`M${cx} ${cy} L${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}Z`, fill:col}, u);
  }
}
function sombraCaja(u, x, y, w, h){ box(x+4, y+5, w, h, BURG, u, 1, {opacity:.28}); }
function clipRect(n, x, y, w, h, tag){ const cp = el('clipPath', {id:'cs'+tag+n}, defs); el('rect', {x,y,width:w,height:h}, cp); return `url(#cs${tag}${n})`; }

const ESPECIALES = {
  copo(u, P){                       // rojo Navidad con copos rosas y pompón de rayos
    const {cx,x0,y0,w,h,n} = P;

    sombraCaja(u, x0, y0, w, h);
    el('rect', {x:x0,y:y0,width:w,height:h,fill:ROJO_NAV}, u);
    const g = el('g', {'clip-path':clipRect(n,x0,y0,w,h,'a')}, u);
    for (let r=0;r<6;r++) for (let k=0;k<3;k++){

    el('polygon', {points:pts.map(p=>p.join(',')).join(' '), fill:'#FFB83D'}, u);

    const {cx,x0,y0,w,h,n} = P;

    for (let r=0;r<8;r++) el('path', {d:`M${x0-4} ${y0+6+r*10.5} q6 -5 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0`, fill:'none', stroke:'#E07A9B', 'stroke-width':2.6}, g);
    const c = '#FFF29A';
    el('line', {x1:cx,y1:y0,x2:cx,y2:y0+h,stroke:c,'stroke-width':3.4}, u);
    el('line', {x1:x0-2,y1:y0+h*0.46,x2:x0+w+2,y2:y0+h*0.46,stroke:c,'stroke-width':3.4}, u);

      el('rect', {x:i===0?ex+19:ex-24, y:y0+h*0.42, width:5, height:h*0.16, fill:'#8B0A0A'}, u);
    });
    return {tx:cx, ty:y0+h*0.5};
  }
};

    }
  }
  function empezar(g){
    limpiar();
    if (quieto || !g) return false;
    velo.classList.add('fx');
    cont.innerHTML = dibujoCaja(g) || dibujo(g.dataset.c1 || '#C21F52', g.dataset.c2 || '#FFEFD9');
    // de la caja pulsada al centro
    const r = g.getBoundingClientRect(), c = cont.getBoundingClientRect();
    const dx = (r.left + r.width/2) - (c.left + c.width/2), dy = (r.top + r.height/2) - (c.top + c.height/2);
    const s0 = Math.max(.2, Math.min(.6, r.width / c.width));
    const A = (el, kf, op) => { const a = el.animate(kf, Object.assign({fill:'both'}, op)); anims.push(a); return a; };
    A(cont, [{transform:`translate(${dx}px,${dy}px) scale(${s0})`, opacity:.0},
             {transform:`translate(${dx*.2}px,${dy*.2}px) scale(${s0+.5})`, opacity:1, offset:.45},
             {transform:'none', opacity:1}], {duration:520, easing:'cubic-bezier(.2,.8,.25,1)'});
    // sacudida
    A(cont.querySelector('svg'), [
      {transform:'rotate(0)'},{transform:'rotate(-5deg) translateY(-2px)'},{transform:'rotate(5deg)'},
      {transform:'rotate(-6deg) translateY(-3px)'},{transform:'rotate(6deg)'},{transform:'rotate(0)'}
    ], {duration:620, delay:560, easing:'ease-in-out'});
    // se abre: tapa y lazo salen volando, luz y confeti
    timers.push(setTimeout(()=>{
      const tapa = cont.querySelector('#fx-tapa'), cuerpo = cont.querySelector('#fx-cuerpo');
      if (!tapa) return;
      tapa.style.transformBox = 'fill-box'; tapa.style.transformOrigin = '50% 100%';
      A(tapa, [{transform:'translateY(0) rotate(0)', opacity:1},
               {transform:'translateY(-34px) rotate(-6deg)', opacity:1, offset:.25},
               {transform:'translate(70px,-230px) rotate(32deg)', opacity:0}], {duration:900, easing:'cubic-bezier(.3,.1,.3,1)'});
      A(luz, [{opacity:0, transform:'scale(.2)'},{opacity:1, transform:'scale(.85)', offset:.35},{opacity:0, transform:'scale(1.5)'}], {duration:1300, easing:'ease-out'});
      confeti();
    }, 1180));
    // sale la tarjeta y el regalo se retira
    timers.push(setTimeout(()=>{
      velo.classList.add('sale');
      A(cont, [{opacity:1, transform:'none'},{opacity:0, transform:'translateY(60px) scale(.8)'}], {duration:520, easing:'ease-in'});
    }, 1650));
    return true;
  }
  return {empezar, limpiar};
})();

/* ---- nieve cayendo (lienzo a pantalla completa) ---- */
(function(){
  const cv = document.getElementById('nieve-cv'), cx = cv.getContext('2d');
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=0, h=0, dpr=1, copos=[];
  function medir(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    w = innerWidth; h = innerHeight;
    cv.width = w*dpr; cv.height = h*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(160, Math.max(70, w*h/9000)));
    copos = Array.from({length:n}, () => {
      const cerca = Math.random() < .28;
      const r = cerca ? 2.8+Math.random()*2.4 : 1+Math.random()*1.8;
      return {x:Math.random()*w, y:Math.random()*h, r, v:(cerca?55:28)+Math.random()*28, ph:Math.random()*6.28, sw:8+Math.random()*18, o:cerca?.95:.55+Math.random()*.3};
    });
  }
  let t0 = performance.now();
  function dibujar(ahora){
    const dt = Math.min(.05, (ahora-t0)/1000); t0 = ahora;
    cx.clearRect(0,0,w,h);
    cx.fillStyle = '#FFF6EA';
    for (const c of copos){
      if(!quieto){ c.y += c.v*dt; c.ph += dt*1.1; c.x += Math.sin(c.ph)*c.sw*dt + 6*dt; }
      if (c.y > h+8){ c.y = -8; c.x = Math.random()*w; }
      if (c.x > w+8) c.x = -8; else if (c.x < -8) c.x = w+8;
      cx.globalAlpha = c.o; cx.beginPath(); cx.arc(c.x, c.y, c.r, 0, 6.2832); cx.fill();
    }
    cx.globalAlpha = 1;
    if(!quieto && !document.hidden) requestAnimationFrame(dibujar);
  }
  medir(); requestAnimationFrame(dibujar);
  addEventListener('resize', medir);
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ t0 = performance.now(); requestAnimationFrame(dibujar); } });
})();

/* ---- intro: se quita sola al terminar el zoom, o al tocar; botón para repetirla ---- */
(function(){
  // telón de bosque: cielo igual al de la página + tres capas de abetos que se abren hacia los bordes
  (function(){
    const NSV='http://www.w3.org/2000/svg', intro=document.getElementById('intro');
    const W = Math.max(420, Math.round(800 * innerWidth / innerHeight)), mid = W/2;
    const sv=document.createElementNS(NSV,'svg'); sv.setAttribute('class','telon'); sv.setAttribute('viewBox','0 0 '+W+' 800'); sv.setAttribute('preserveAspectRatio','xMidYMid slice'); sv.setAttribute('aria-hidden','true');
    const mk=(n,a,p)=>{const e=document.createElementNS(NSV,n); for(const k in a) e.setAttribute(k,a[k]); (p||sv).appendChild(e); return e;};
    let sd=11; const rr=()=>(sd=(sd*16807)%2147483647)/2147483647;
    const defs=mk('defs',{});
    const gr=mk('linearGradient',{id:'cielo-i',x1:0,y1:0,x2:0,y2:1},defs);
    [['0%','#5C0A22'],['35%','#7A1636'],['65%','#A8406A'],['88%','#D9899E'],['100%','#F3CBD7']].forEach(([o,c])=>mk('stop',{offset:o,'stop-color':c},gr));
    const gl=mk('radialGradient',{id:'glow-i'},defs);
    mk('stop',{offset:'0%','stop-color':'#FFEFD9','stop-opacity':.35},gl); mk('stop',{offset:'100%','stop-color':'#FFEFD9','stop-opacity':0},gl);
    // cielo
    const cielo=mk('g',{'class':'cielo-i'});
    mk('rect',{x:-10,y:-10,width:W+20,height:820,fill:'url(#cielo-i)'},cielo);
    mk('circle',{cx:mid,cy:520,r:Math.max(W*.45,360),fill:'url(#glow-i)'},cielo);
    for(let i=0;i<46;i++){
      const x=rr()*W, y=rr()*420, r=rr();
      if(r>.55){ const R=4+rr()*6; mk('path',{d:`M${x} ${y-R}Q${x} ${y} ${x+R} ${y}Q${x} ${y} ${x} ${y+R}Q${x} ${y} ${x-R} ${y}Q${x} ${y} ${x} ${y-R}Z`,fill:'#FFEFD9',opacity:(.5+rr()*.5).toFixed(2)},cielo); }
      else mk('circle',{cx:x.toFixed(0),cy:y.toFixed(0),r:(1+rr()*1.6).toFixed(1),fill:'#FFEFD9',opacity:.75},cielo);
    }
    // abeto entero, mismo estilo que los de la página (pisos dentados, adornos y estrella)
    function abeto(g,cx,base,h,c1,c2,adornos){
      const w=h*.6, tiers=5, th=h*.27, step=h*.155;
      mk('rect',{x:cx-h*.04,y:base-h*.09,width:h*.08,height:h*.12,fill:'#2A0310'},g);
      for(let i=0;i<tiers;i++){
        const yb=base-h*.06-i*step, ya=yb-th, hw=w/2*(1-i*.16);
        const d=`M${cx} ${ya} L${cx+hw} ${yb} L${cx+hw*.6} ${yb-th*.12} L${cx+hw*.3} ${yb+th*.02} L${cx} ${yb-th*.12} L${cx-hw*.3} ${yb+th*.02} L${cx-hw*.6} ${yb-th*.12} L${cx-hw} ${yb} Z`;
        mk('path',{d,fill:'#2A0310',opacity:.25,transform:`translate(${h*.012} ${h*.016})`},g);
        mk('path',{d,fill:i%2?c2:c1},g);
        if(adornos){
          mk('circle',{cx:cx-hw*.45,cy:yb-th*.22,r:h*.011+1,fill:i%2?'#F18BC4':'#FFEFD9'},g);
          mk('circle',{cx:cx+hw*.4,cy:yb-th*.3,r:h*.011+1,fill:i%2?'#FFEFD9':'#F18BC4'},g);
        }
      }
      if(adornos){ const ty=base-h*.06-(tiers-1)*step-th, R=h*.05; mk('path',{d:`M${cx} ${ty-R}Q${cx} ${ty} ${cx+R} ${ty}Q${cx} ${ty} ${cx} ${ty+R}Q${cx} ${ty} ${cx-R} ${ty}Q${cx} ${ty} ${cx} ${ty-R}Z`,fill:'#FFEFD9'},g); }
    }
    // capas: [nombre, nº árboles por lado, alto min/max, base y, colores, adornos, borde final (fracción del ancho), opacidad final, retraso, duración]
    const CAPAS = [
      ['fondo', 7, 230, 300, 600, ['#A3496E','#8E3A5C'], false, .02, 0,  .42, 1.7],
      ['medio', 6, 340, 430, 700, ['#6E1A41','#4A0D2B'], false, .07, .35, .32, 1.75],
      ['frente',5, 520, 640, 840, ['#0E5A33','#1B7A47','#4A0D2B','#6E1A41'], true, .13, 1, .22, 1.8]
    ];
    // en pantallas estrechas (teléfono) árboles más pequeños y que se retiren más al borde, para no tapar la casa
    const estrecha = W < 700, esc = estrecha ? .8 : 1;
    CAPAS.forEach(([nom,n,hMin,hMax,base,cols,ador,borde,opFin,del,dur])=>{
      if (estrecha){ hMin*=esc; hMax*=esc; base = 800 - (800-base)*esc*.8; borde -= .09; n = Math.max(3, n-1); }
      ['izq','der'].forEach(lado=>{
        const izq = lado==='izq';
        const g = mk('g',{'class':'capa '+nom});
        // los árboles van del borde hasta pasar un poco el centro, para que no haya corte recto
        const desde = -W*.04, hasta = mid + W*.05, paso = (hasta-desde)/(n-1);
        const arboles = [];
        for(let k=0;k<n;k++){
          const x = desde + k*paso + (rr()-.5)*paso*.35, h = hMin + rr()*(hMax-hMin);
          arboles.push({x: izq ? x : W-x, b: base + (rr()-.5)*24, h, c: k});
        }
        // los del centro, delante (más grandes y más abajo)
        arboles.sort((a,b)=>a.b-b.b).forEach(t=>{
          const ci = (t.c + (izq?0:1)) % (cols.length/2|0||1);
          abeto(g, t.x, t.b, t.h, cols[ci*2]||cols[0], cols[ci*2+1]||cols[1], ador);
        });
        if(nom==='frente') mk('ellipse',{cx: izq ? mid*.45 : W-mid*.45, cy:808, rx:mid*.95, ry:46, fill:'#F3CBD7'},g);
        // cuánto se mueve: el árbol más interior acaba a "borde" del lateral
        const dx = (W*borde) - (hasta + W*.03);
        g.setAttribute('style',`--dx:${(izq?dx:-dx).toFixed(0)}px;--op:${opFin};--del:${del}s;--dur:${dur}s`);
      });
    });
    intro.insertBefore(sv, intro.firstChild);
  })();

  const molde = document.getElementById('intro').outerHTML;
  let temporizador;
  function quitar(){
    clearTimeout(temporizador);
    document.body.classList.remove('intro-on');

  }
  if (PREVIEW) document.querySelectorAll('.demo-barra .seg button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.p === 'todo'){ setVista(24, true); aviso(VENTA ? 'Vista desbloqueada: pagado y los 24 días abiertos.' : 'Vista desbloqueada: los 24 días abiertos.'); }
    else { setVista(3, false); aviso(VENTA ? 'Hoy es 3 de diciembre y aún no has pagado.' : 'Hoy es 3 de diciembre: abiertos los días 1, 2 y 3.'); }
  }));
  if (PREVIEW) sel.addEventListener('change', () => { setVista(+sel.value, pagado); aviso(`Ahora es ${sel.value} de diciembre.`); });
  if (PREVIEW && VENTA) chk.addEventListener('change', () => { setVista(diaDeHoy(), chk.checked); aviso(chk.checked ? 'Ahora estás como compradora.' : 'Ahora estás sin pagar.'); });
  if (PREVIEW) $('demo-min').addEventListener('click', () => {
    const b = $('demo-barra'), m = b.classList.toggle('mini');
    $('demo-min').textContent = m ? 'Vista' : '–';
  });

  pintarEstados();
  AdventClock.watch(ANIO, pintarEstados);
})();
</script>
</body>
</html>
