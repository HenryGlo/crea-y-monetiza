<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tu casa de regalos · Alumnas</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#4a0d22;color:#fff6eb;font:17px/1.55 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,480px);padding:clamp(24px,6vw,44px);border:1px solid #f18bc466;border-radius:28px;background:#59132c}small{color:#f18bc4;letter-spacing:.12em;text-transform:uppercase}h1{font:700 clamp(32px,7vw,44px)/1.1 Georgia,serif;margin:18px 0}p{color:#f9cfdb}label{display:block;font-weight:600;margin:18px 0 8px}input,button{font:inherit;width:100%;border-radius:12px;padding:14px 16px}input{background:#fff6eb;color:#4a0d22;border:2px solid transparent}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #f5b83d;outline-offset:4px}button{margin-top:22px;border:0;background:#f18bc4;color:#4a0d22;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}a{color:#fff6eb}#message{min-height:2em}#restart{background:transparent;color:#f9cfdb;font-size:15px;margin:8px 0 0;padding:10px}footer{margin-top:24px;font-size:14px;text-align:center}[hidden]{display:none!important}@media(prefers-reduced-motion:no-preference){main{animation:arrive .3s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style></head><body><main><small>Campus Crea y Monetiza</small><h1>Tu casa de regalos 🎁</h1><p id="intro">Este espacio es para nuestras alumnas. Escribe el correo con el que estás inscrita y te enviaremos un código para entrar.</p><form id="access"><label for="email">Tu correo</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><div id="code-field" hidden><label for="otp">Código de acceso</label><input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"><p>El código dura 10 minutos. Revisa también spam o promociones.</p></div><p id="message" role="status" aria-live="polite"></p><button id="submit">Enviarme el código</button><button id="restart" type="button" hidden>Usar otro correo o pedir otro código</button></form><footer><a href="https://campuscreaymonetiza.com/calendario/">Ir al calendario público</a></footer></main><script src="/calendario/login.js" defer></script></body></html>
